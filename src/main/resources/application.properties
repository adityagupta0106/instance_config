spring.application.name=InstanceConfigRegistry
server.port = 9091

server.servlet.context-path=/configuration

spring.profiles.active=configure


#graphql.servlet.mapping=/graphql
#graphql.servlet.enabled=true


splus.usermanagement.service = lb://USERMANAGEMENT/usermgmt
splus.esb.service = lb://INTEGRATION/esb
splus.servicemetadata.service = lb://SERVICEMETADATA/services

# Resilience4j Circuit Breaker Configuration - USERMANAGEMENT

resilience4j.circuitbreaker.instances.USERMANAGEMENT.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.USERMANAGEMENT.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.USERMANAGEMENT.slidingWindowType=TIME_BASED
resilience4j.circuitbreaker.instances.USERMANAGEMENT.slidingWindowSize=10
resilience4j.circuitbreaker.instances.USERMANAGEMENT.minimumNumberOfCalls=500
resilience4j.circuitbreaker.instances.USERMANAGEMENT.failureRateThreshold=30
resilience4j.circuitbreaker.instances.USERMANAGEMENT.slow-call-rate-threshold=30
resilience4j.circuitbreaker.instances.USERMANAGEMENT.waitDurationInOpenState=60s
resilience4j.circuitbreaker.instances.USERMANAGEMENT.permittedNumberOfCallsInHalfOpenState=100
resilience4j.circuitbreaker.instances.USERMANAGEMENT.automatic-transition-from-open-to-half-open-enabled=true


# TimeLimiter
resilience4j.timelimiter.instances.USERMANAGEMENT.timeoutDuration=150s


# Resilience4j Circuit Breaker Configuration - DEFAULT

resilience4j.circuitbreaker.instances.default.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.default.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.default.slidingWindowType=TIME_BASED
resilience4j.circuitbreaker.instances.default.slidingWindowSize=20
resilience4j.circuitbreaker.instances.default.minimumNumberOfCalls=500
resilience4j.circuitbreaker.instances.default.failureRateThreshold=30
resilience4j.circuitbreaker.instances.default.slow-call-rate-threshold=30
resilience4j.circuitbreaker.instances.default.waitDurationInOpenState=60s
resilience4j.circuitbreaker.instances.default.permittedNumberOfCallsInHalfOpenState=100
resilience4j.circuitbreaker.instances.default.automatic-transition-from-open-to-half-open-enabled=true


# TimeLimiter
resilience4j.timelimiter.instances.default.timeoutDuration=150s


instances.circuitBreaker.critical.error =

kafka.update.credential.topic = updateUserCredential
kafka.topic.instant-notification = kafka.topic.instant-notification
kafka.topic.new-tenant-onboard = kafka.topic.new-tenant-onboard

app.environment = STAG

notification.kafka.topic = kafka.topic.instant-notification

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Sort operations by HTTP method
springdoc.swagger-ui.operationsSorter=method

# Sort tags alphabetically
springdoc.swagger-ui.tagsSorter=alpha

# Display request execution time
springdoc.swagger-ui.display-request-duration=true

# Collapse all sections by default
springdoc.swagger-ui.doc-expansion=none
