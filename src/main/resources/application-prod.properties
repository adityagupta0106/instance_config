spring.data.mongodb.database=RegistryService
spring.data.mongodb.uri=mongodb://root:root@localhost:22222,localhost:22223/?replicaSet=myReplicaSet&authSource=admin
spring.data.mongodb.auto-index-creation=true

eureka.client.service-url.defaultZone=http://10.1.11.100:7070/eureka/
eureka.client.should-unregister-on-shutdown=true
eureka.instance.prefer-ip-address=true
#eureka.instance.hostname=localhost


#Redis Conf
spring.data.redis.host=localhost
spring.data.redis.password=password_new
spring.data.redis.port=6379
spring.data.redis.connect-timeout=1000
spring.data.redis.timeout=1000
spring.redis.jedis.pool.max-wait=1000


# Kafka
spring.kafka.bootstrap-servers=10.1.11.100:9092

# Serializers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Reliability
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Timeouts
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=3000
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.retry.backoff.ms=500

